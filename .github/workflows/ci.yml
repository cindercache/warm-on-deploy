name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The action declares runs.using node24, so the suite runs on the same major version the
      # runner will use. There are no dependencies, so there is nothing to install.
      - run: node --test test.mjs
